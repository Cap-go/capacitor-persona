name: Build source code and test it

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  guard_swiftpm_version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          if ! grep -Eq 'https://github.com/ionic-team/capacitor-swift-pm\.git"[[:space:]]*,[[:space:]]*from:[[:space:]]*"8\.0\.0"' Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to 8.0.0 in Package.swift"
            exit 1
          fi
  build_android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Verify npm package identity
        run: bun run check:package-identity
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Check Persona SDK pins
        run: bun run check:persona-pin
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Build
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android
  build_ios:
    runs-on: macOS-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Verify npm package identity
        run: bun run check:package-identity
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Check Persona SDK pins
        run: bun run check:persona-pin
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios
  test_ios:
    runs-on: macOS-latest
    timeout-minutes: 10
    name: 'iOS unit tests (simulator)'
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Run XCTests on an iPhone simulator xcodebuild considers eligible
        run: |
          set -euo pipefail
          udid="$(xcodebuild -showdestinations -scheme CapgoCapacitorPersona 2>/dev/null | grep 'platform:iOS Simulator' | grep 'name:iPhone' | tail -1 | sed -E 's/.*id:([0-9A-F-]+).*/\1/')"
          test -n "$udid"
          echo "Using simulator id: $udid"
          xcodebuild test -scheme CapgoCapacitorPersona -destination "platform=iOS Simulator,id=$udid"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: 'Build code and test'
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Verify npm package identity
        run: bun run check:package-identity
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Check Persona SDK pins
        run: bun run check:persona-pin
      - name: Lint
        id: lint_code
        run: bun run lint
      - name: Verify packed package in example app (Web)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh web
      - name: Verify
        id: verify_code
        run: bun run verify:web
